<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Management System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Arcade Management System</h1>
            <div class="header-right">
                <span id="current-user"></span>
                <button id="logout-btn" class="btn btn-sm">Logout</button>
            </div>
        </header>

        <nav class="tabs">
            <button class="tab-btn active" data-tab="members">Members</button>
            <button class="tab-btn" data-tab="machines">Machines</button>
            <button class="tab-btn" data-tab="transactions">Transactions</button>
            <button class="tab-btn admin-only hidden" data-tab="staff">Staff</button>
        </nav>

        <!-- Members Tab -->
        <section id="tab-members" class="tab-content active">
            <div class="toolbar">
                <input type="text" id="member-search" class="search-input" placeholder="Search name or phone...">
                <button id="member-add-btn" class="btn btn-primary">+ Add Member</button>
            </div>
            <div class="table-wrapper">
                <table id="member-table">
                    <thead>
                        <tr>
                            <th data-sort="name">Name <span class="sort-icon"></span></th>
                            <th data-sort="phone">Phone</th>
                            <th data-sort="vipLevel">VIP Level <span class="sort-icon"></span></th>
                            <th data-sort="tokenBalance">Token Balance <span class="sort-icon"></span></th>
                            <th data-sort="accumulatedSpend">Total Spent <span class="sort-icon"></span></th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
            <div class="pagination">
                <span class="page-info"></span>
                <button class="btn btn-sm page-prev">Prev</button>
                <button class="btn btn-sm page-next">Next</button>
            </div>
        </section>

        <!-- Machines Tab -->
        <section id="tab-machines" class="tab-content">
            <div class="toolbar">
                <input type="text" id="machine-search" class="search-input" placeholder="Search name or type...">
                <button id="machine-add-btn" class="btn btn-primary">+ Add Machine</button>
            </div>
            <div class="table-wrapper">
                <table id="machine-table">
                    <thead>
                        <tr>
                            <th data-sort="name">Name <span class="sort-icon"></span></th>
                            <th data-sort="type">Type <span class="sort-icon"></span></th>
                            <th data-sort="tokensPerGame">Tokens/Game <span class="sort-icon"></span></th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
            <div class="pagination">
                <span class="page-info"></span>
                <button class="btn btn-sm page-prev">Prev</button>
                <button class="btn btn-sm page-next">Next</button>
            </div>
        </section>

        <!-- Transactions Tab -->
        <section id="tab-transactions" class="tab-content">
            <div class="toolbar">
                <input type="text" id="transaction-search" class="search-input" placeholder="Search transactions...">
                <button id="recharge-btn" class="btn btn-success">+ Recharge</button>
                <button id="consume-btn" class="btn btn-warning">- Consume</button>
                <button id="package-btn" class="btn">Package</button>
            </div>
            <div class="table-wrapper">
                <table id="transaction-table">
                    <thead>
                        <tr>
                            <th>Member</th>
                            <th>Amount</th>
                            <th>Tokens</th>
                            <th>Machine</th>
                            <th>Time</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
            <div class="pagination">
                <span class="page-info"></span>
                <button class="btn btn-sm page-prev">Prev</button>
                <button class="btn btn-sm page-next">Next</button>
            </div>
        </section>

        <!-- Staff Tab (admin only) -->
        <section id="tab-staff" class="tab-content">
            <div class="toolbar">
                <input type="text" id="staff-search" class="search-input" placeholder="Search username...">
            </div>
            <div class="table-wrapper">
                <table id="staff-table">
                    <thead>
                        <tr>
                            <th data-sort="username">Username <span class="sort-icon"></span></th>
                            <th>Role</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
            <div class="pagination">
                <span class="page-info"></span>
                <button class="btn btn-sm page-prev">Prev</button>
                <button class="btn btn-sm page-next">Next</button>
            </div>
        </section>
    </div>

    <!-- Modal -->
    <div id="modal-overlay" class="modal-overlay hidden">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modal-title"></h3>
                <button id="modal-close" class="btn-close">&times;</button>
            </div>
            <div class="modal-body" id="modal-body"></div>
            <div class="modal-footer">
                <button id="modal-cancel" class="btn">Cancel</button>
                <button id="modal-submit" class="btn btn-primary">OK</button>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/member.js"></script>
    <script src="js/machine.js"></script>
    <script src="js/transaction.js"></script>
    <script src="js/staff.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
