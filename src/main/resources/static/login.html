<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Management System - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h1>Arcade Management System</h1>

            <!-- Login Form -->
            <form id="login-form" class="auth-form">
                <h2>Login</h2>
                <div class="form-group">
                    <input type="text" id="login-username" placeholder="Username" autocomplete="username">
                </div>
                <div class="form-group">
                    <input type="password" id="login-password" placeholder="Password" autocomplete="current-password">
                </div>
                <div id="login-error" class="auth-error hidden"></div>
                <button type="submit" class="btn btn-primary login-btn">Login</button>
                <p class="auth-switch">Don't have an account? <a href="#" id="show-register">Register</a></p>
            </form>

            <!-- Register Form (hidden by default) -->
            <form id="register-form" class="auth-form hidden">
                <h2>Register</h2>
                <div class="form-group">
                    <input type="text" id="reg-username" placeholder="Username" autocomplete="username">
                </div>
                <div class="form-group">
                    <input type="password" id="reg-password" placeholder="Password" autocomplete="new-password">
                </div>
                <div class="form-group">
                    <select id="reg-role">
                        <option value="">Select Role</option>
                        <option value="admin">Admin</option>
                        <option value="worker">Worker</option>
                    </select>
                </div>
                <div id="register-error" class="auth-error hidden"></div>
                <button type="submit" class="btn btn-primary login-btn">Register</button>
                <p class="auth-switch">Already have an account? <a href="#" id="show-login">Back to Login</a></p>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        // Toggle login/register forms
        document.getElementById('show-register').addEventListener('click', (e) => {
            e.preventDefault();
            document.getElementById('login-form').classList.add('hidden');
            document.getElementById('register-form').classList.remove('hidden');
            document.getElementById('login-error').classList.add('hidden');
            document.getElementById('register-error').classList.add('hidden');
        });

        document.getElementById('show-login').addEventListener('click', (e) => {
            e.preventDefault();
            document.getElementById('register-form').classList.add('hidden');
            document.getElementById('login-form').classList.remove('hidden');
            document.getElementById('register-error').classList.add('hidden');
            document.getElementById('login-error').classList.add('hidden');
        });

        // Login
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value.trim();

            if (!username || !password) {
                document.getElementById('login-error').textContent = 'Please enter username and password';
                document.getElementById('login-error').classList.remove('hidden');
                return;
            }

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const json = await res.json();
                if (json.code !== 200) {
                    document.getElementById('login-error').textContent = json.message;
                    document.getElementById('login-error').classList.remove('hidden');
                    return;
                }
                sessionStorage.setItem('user', JSON.stringify(json.data));
                window.location.href = '/index.html';
            } catch (err) {
                document.getElementById('login-error').textContent = 'Network error, please try again';
                document.getElementById('login-error').classList.remove('hidden');
            }
        });

        // Register
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('reg-username').value.trim();
            const password = document.getElementById('reg-password').value.trim();
            const permissionLevel = document.getElementById('reg-role').value;

            if (!username || !password) {
                document.getElementById('register-error').textContent = 'Please enter username and password';
                document.getElementById('register-error').classList.remove('hidden');
                return;
            }
            if (!permissionLevel) {
                document.getElementById('register-error').textContent = 'Please select a role';
                document.getElementById('register-error').classList.remove('hidden');
                return;
            }

            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, permissionLevel })
                });
                const json = await res.json();
                if (json.code !== 200) {
                    document.getElementById('register-error').textContent = json.message;
                    document.getElementById('register-error').classList.remove('hidden');
                    return;
                }
                document.getElementById('register-form').classList.add('hidden');
                document.getElementById('login-form').classList.remove('hidden');
                document.getElementById('register-error').classList.add('hidden');
                showToast('Registration successful, please login', 'success');
            } catch (err) {
                document.getElementById('register-error').textContent = 'Network error, please try again';
                document.getElementById('register-error').classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
